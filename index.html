<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Best</span>
          <span id="best-score" class="score-value">0</span>
        </div>
      </div>
    </header>

    <div class="controls-row">
      <p class="instructions">Use arrow keys (or swipe) to combine tiles and reach 2048!</p>
      <button id="new-game-btn" class="new-game-btn">New Game</button>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board">
        <!-- Background grid cells (4x4) are generated by JS -->
        <div id="grid-cells" class="grid-cells"></div>
        <!-- Tiles are dynamically inserted here by JS -->
        <div id="tile-container" class="tile-container"></div>
      </div>

      <div id="message-overlay" class="message-overlay hidden">
        <p id="message-text" class="message-text"></p>
        <button id="try-again-btn" class="try-again-btn">Try Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
